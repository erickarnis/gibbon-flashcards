<script>
const examples=[{"id":"gibbon-01-nerva-accession","label":"One picture + quotation","front":"\u003cmain class=\"gibbon-card\">\n  \u003cp class=\"deck-label\">Gibbon · Decline and Fall\u003c/p>\n  \u003cdiv class=\"question\">When, and after what overthrow, did Nerva become emperor?\u003c/div>\n  \n\u003c/main>\n","back":"\u003cmain class=\"gibbon-card\">\n  \u003cp class=\"deck-label\">Gibbon · Decline and Fall\u003c/p>\n  \u003cdiv class=\"question question-reminder\">When, and after what overthrow, did Nerva become emperor?\u003c/div>\n  \u003chr id=\"answer\">\n  \u003csection class=\"answer-text\" aria-label=\"Answer\">\u003cstrong>AD 96\u003c/strong>, after the assassination of \u003cstrong>Domitian\u003c/strong>. The Senate recognised the elderly Nerva as emperor; a palace murder had changed the master without restoring the republic.\u003c/section>\n  \u003csection class=\"pictures\" aria-label=\"Pictures\">\u003cfigure>\u003cdiv class=\"image-frame\">\u003cimg src=\"../images/people/nerva.jpg\" alt=\"Nerva: Ancient object; attribution per source\" width=\"894\" height=\"1200\">\u003c/div>\u003cfigcaption>\u003cstrong>Nerva\u003c/strong>Emperor from AD 96\u003cspan class=\"depiction\">Ancient object; attribution per source · Ancient portrait head; preferred to the default coin for a clear face.\u003c/span>\u003c/figcaption>\u003cdetails class=\"picture-zoom\">\u003csummary>Enlarge\u003c/summary>\u003cimg src=\"../images/people/nerva.jpg\" alt=\"Nerva: Ancient object; attribution per source\" width=\"894\" height=\"1200\">\u003c/details>\u003c/figure>\u003c/section>\n  \u003csection class=\"quotation\" aria-label=\"Gibbon quotation\">\n    \u003ch2>Gibbon\u003c/h2>\n    \u003cblockquote>“They attacked the person of the tyrant without aiming their blow at the authority of the emperor.”\u003c/blockquote>\n  \u003c/section>\n  \n  \u003cdetails class=\"sources\">\u003csummary>Sources\u003c/summary>\u003cdiv class=\"detail-content\">\u003ca href=\"../sources/mueller-opening.md#L704\">Gibbon, Ch. III, L704\u003c/a>; \u003ca href=\"../sources/mueller-opening.md#L716\">Gibbon, Ch. III, L716\u003c/a>; \u003ca href=\"../sources/mueller-opening.md#L4981\">imperial table, L4981\u003c/a>; \u003ca href=\"https://roman-emperors.sites.luc.edu/nerva.htm\">DIR: Nerva, Early Career and Life under Domitian\u003c/a>.\u003c/div>\u003c/details>\n  \u003cdetails class=\"sources\">\u003csummary>Image credits\u003c/summary>\u003cdiv class=\"detail-content\">\u003cp>\u003cstrong>Nerva\u003c/strong>\u003cbr>Sergey Sosnovskiy · \u003ca href=\"https://commons.wikimedia.org/wiki/File:Nerva_head,_Rome,_Vatican_Museums,_Pius-Clementine_Museum,_96-98_CE.jpg\">Source\u003c/a> · \u003ca href=\"https://creativecommons.org/licenses/by-sa/4.0\">CC BY-SA 4.0\u003c/a>\u003cbr>https://ancientrome.ru/art/artworken/img.htm?id=8186 · Attribute the creator, link the exact licence, mark changes, and apply its ShareAlike terms to adaptations.\u003cbr>Displayed without cropping or alteration.\u003c/p>\u003c/div>\u003c/details>\n\u003c/main>\n"},{"id":"gibbon-01-nerva-trajan","label":"Two pictures + context","front":"\u003cmain class=\"gibbon-card\">\n  \u003cp class=\"deck-label\">Gibbon · Decline and Fall\u003c/p>\n  \u003cdiv class=\"question\">Whom did Nerva adopt as his successor, when, and what strength did the choice supply?\u003c/div>\n  \n\u003c/main>\n","back":"\u003cmain class=\"gibbon-card\">\n  \u003cp class=\"deck-label\">Gibbon · Decline and Fall\u003c/p>\n  \u003cdiv class=\"question question-reminder\">Whom did Nerva adopt as his successor, when, and what strength did the choice supply?\u003c/div>\n  \u003chr id=\"answer\">\n  \u003csection class=\"answer-text\" aria-label=\"Answer\">\u003cstrong>Trajan, in AD 97\u003c/strong>: an experienced commander on the Rhine, whose military standing could sustain the authority which Nerva&#39;s mildness could not command.\u003c/section>\n  \u003csection class=\"pictures\" aria-label=\"Pictures\">\u003cfigure>\u003cdiv class=\"image-frame\">\u003cimg src=\"../images/people/nerva.jpg\" alt=\"Nerva: Ancient object; attribution per source\" width=\"894\" height=\"1200\">\u003c/div>\u003cfigcaption>\u003cstrong>Nerva\u003c/strong>Adopting emperor\u003cspan class=\"depiction\">Ancient object; attribution per source · Ancient portrait head; preferred to the default coin for a clear face.\u003c/span>\u003c/figcaption>\u003cdetails class=\"picture-zoom\">\u003csummary>Enlarge\u003c/summary>\u003cimg src=\"../images/people/nerva.jpg\" alt=\"Nerva: Ancient object; attribution per source\" width=\"894\" height=\"1200\">\u003c/details>\u003c/figure>\u003cfigure>\u003cdiv class=\"image-frame\">\u003cimg src=\"../images/people/trajan.jpg\" alt=\"Trajan: Ancient object; attribution per source\" width=\"1689\" height=\"2200\">\u003c/div>\u003cfigcaption>\u003cstrong>Trajan\u003c/strong>Adopted heir\u003cspan class=\"depiction\">Ancient object; attribution per source\u003c/span>\u003c/figcaption>\u003cdetails class=\"picture-zoom\">\u003csummary>Enlarge\u003c/summary>\u003cimg src=\"../images/people/trajan.jpg\" alt=\"Trajan: Ancient object; attribution per source\" width=\"1689\" height=\"2200\">\u003c/details>\u003c/figure>\u003c/section>\n  \n  \u003cdetails class=\"more\">\u003csummary>More context\u003c/summary>\u003cdiv class=\"detail-content\">Trajan stood outside Nerva&#39;s family.\u003c/div>\u003c/details>\n  \u003cdetails class=\"sources\">\u003csummary>Sources\u003c/summary>\u003cdiv class=\"detail-content\">\u003ca href=\"../sources/mueller-opening.md#L716\">Gibbon, Ch. III, L716\u003c/a>; \u003ca href=\"../sources/mueller-opening.md#L4983\">imperial table, L4983\u003c/a>; \u003ca href=\"https://roman-emperors.sites.luc.edu/trajan.htm\">DIR: Trajan, Early Life and Career\u003c/a>.\u003c/div>\u003c/details>\n  \u003cdetails class=\"sources\">\u003csummary>Image credits\u003c/summary>\u003cdiv class=\"detail-content\">\u003cp>\u003cstrong>Nerva\u003c/strong>\u003cbr>Sergey Sosnovskiy · \u003ca href=\"https://commons.wikimedia.org/wiki/File:Nerva_head,_Rome,_Vatican_Museums,_Pius-Clementine_Museum,_96-98_CE.jpg\">Source\u003c/a> · \u003ca href=\"https://creativecommons.org/licenses/by-sa/4.0\">CC BY-SA 4.0\u003c/a>\u003cbr>https://ancientrome.ru/art/artworken/img.htm?id=8186 · Attribute the creator, link the exact licence, mark changes, and apply its ShareAlike terms to adaptations.\u003cbr>Displayed without cropping or alteration.\u003c/p>\u003cp>\u003cstrong>Trajan\u003c/strong>\u003cbr>Unknown artistUnknown artist · \u003ca href=\"https://commons.wikimedia.org/wiki/File:Traianus_Glyptothek_Munich_72.jpg\">Source\u003c/a> · Public domain\u003cbr>User:Bibi Saint-Pol, own work, 2007-02-08 · Source records public domain / dedication; keep provenance and check territorial or non-copyright restrictions before publication.\u003cbr>Displayed without cropping or alteration.\u003c/p>\u003c/div>\u003c/details>\n\u003c/main>\n"},{"id":"gibbon-01-trajan-column","label":"Picture + quotation + context","front":"\u003cmain class=\"gibbon-card\">\n  \u003cp class=\"deck-label\">Gibbon · Decline and Fall\u003c/p>\n  \u003cdiv class=\"question\">What did Trajan&#39;s Column commemorate, and why does Gibbon dwell on it?\u003c/div>\n  \n\u003c/main>\n","back":"\u003cmain class=\"gibbon-card\">\n  \u003cp class=\"deck-label\">Gibbon · Decline and Fall\u003c/p>\n  \u003cdiv class=\"question question-reminder\">What did Trajan&#39;s Column commemorate, and why does Gibbon dwell on it?\u003c/div>\n  \u003chr id=\"answer\">\n  \u003csection class=\"answer-text\" aria-label=\"Answer\">His \u003cstrong>Dacian victories\u003c/strong>. The veteran could revisit his campaigns in marble; the peaceful citizen could borrow a share of their glory.\u003c/section>\n  \u003csection class=\"pictures\" aria-label=\"Pictures\">\u003cfigure>\u003cdiv class=\"image-frame\">\u003cimg src=\"../images/people/trajan.jpg\" alt=\"Trajan: Ancient object; attribution per source\" width=\"1689\" height=\"2200\">\u003c/div>\u003cfigcaption>\u003cstrong>Trajan\u003c/strong>Emperor whose victories are commemorated\u003cspan class=\"depiction\">Ancient object; attribution per source\u003c/span>\u003c/figcaption>\u003cdetails class=\"picture-zoom\">\u003csummary>Enlarge\u003c/summary>\u003cimg src=\"../images/people/trajan.jpg\" alt=\"Trajan: Ancient object; attribution per source\" width=\"1689\" height=\"2200\">\u003c/details>\u003c/figure>\u003c/section>\n  \u003csection class=\"quotation\" aria-label=\"Gibbon quotation\">\n    \u003ch2>Gibbon\u003c/h2>\n    \u003cblockquote>“The veteran soldier contemplated the story of his own campaigns, and by an easy illusion of national vanity, the peaceful citizen associated himself to the honors of the triumph.”\u003c/blockquote>\n  \u003c/section>\n  \u003cdetails class=\"more\">\u003csummary>More context\u003c/summary>\u003cdiv class=\"detail-content\">The column stood in Trajan&#39;s public forum; Gibbon gives its height as \u003cstrong>110 feet\u003c/strong>.\u003c/div>\u003c/details>\n  \u003cdetails class=\"sources\">\u003csummary>Sources\u003c/summary>\u003cdiv class=\"detail-content\">\u003ca href=\"../sources/mueller-opening.md#L637\">Gibbon, Ch. II, L637\u003c/a>.\u003c/div>\u003c/details>\n  \u003cdetails class=\"sources\">\u003csummary>Image credits\u003c/summary>\u003cdiv class=\"detail-content\">\u003cp>\u003cstrong>Trajan\u003c/strong>\u003cbr>Unknown artistUnknown artist · \u003ca href=\"https://commons.wikimedia.org/wiki/File:Traianus_Glyptothek_Munich_72.jpg\">Source\u003c/a> · Public domain\u003cbr>User:Bibi Saint-Pol, own work, 2007-02-08 · Source records public domain / dedication; keep provenance and check territorial or non-copyright restrictions before publication.\u003cbr>Displayed without cropping or alteration.\u003c/p>\u003c/div>\u003c/details>\n\u003c/main>\n"},{"id":"gibbon-03-tetrarchy-failure","label":"Four pictures + long quotation","front":"\u003cmain class=\"gibbon-card\">\n  \u003cp class=\"deck-label\">Gibbon · Decline and Fall\u003c/p>\n  \u003cdiv class=\"question\">Why does Gibbon think Diocletian’s balance of power failed after his retirement?\u003c/div>\n  \n\u003c/main>\n","back":"\u003cmain class=\"gibbon-card\">\n  \u003cp class=\"deck-label\">Gibbon · Decline and Fall\u003c/p>\n  \u003cdiv class=\"question question-reminder\">Why does Gibbon think Diocletian’s balance of power failed after his retirement?\u003c/div>\n  \u003chr id=\"answer\">\n  \u003csection class=\"answer-text\" aria-label=\"Answer\">Its harmony depended on \u003cstrong>Diocletian’s personal authority\u003c/strong> and an unlikely absence of rivalry among four rulers. The institutional arrangement could not reproduce the man who held it together.\u003c/section>\n  \u003csection class=\"pictures\" aria-label=\"Pictures\">\u003cfigure>\u003cdiv class=\"image-frame\">\u003cimg src=\"../images/people/diocletian.jpg\" alt=\"Diocletian: Ancient object; attribution per source\" width=\"1280\" height=\"1707\">\u003c/div>\u003cfigcaption>\u003cstrong>Diocletian\u003c/strong>Augustus\u003cspan class=\"depiction\">Ancient object; attribution per source\u003c/span>\u003c/figcaption>\u003cdetails class=\"picture-zoom\">\u003csummary>Enlarge\u003c/summary>\u003cimg src=\"../images/people/diocletian.jpg\" alt=\"Diocletian: Ancient object; attribution per source\" width=\"1280\" height=\"1707\">\u003c/details>\u003c/figure>\u003cfigure>\u003cdiv class=\"image-frame\">\u003cimg src=\"../images/people/maximian.jpg\" alt=\"Maximian: Ancient object; attribution per source\" width=\"1920\" height=\"2617\">\u003c/div>\u003cfigcaption>\u003cstrong>Maximian\u003c/strong>Augustus\u003cspan class=\"depiction\">Ancient object; attribution per source\u003c/span>\u003c/figcaption>\u003cdetails class=\"picture-zoom\">\u003csummary>Enlarge\u003c/summary>\u003cimg src=\"../images/people/maximian.jpg\" alt=\"Maximian: Ancient object; attribution per source\" width=\"1920\" height=\"2617\">\u003c/details>\u003c/figure>\u003cfigure>\u003cdiv class=\"image-frame\">\u003cimg src=\"../images/people/galerius.jpg\" alt=\"Galerius: Ancient object; attribution per source\" width=\"500\" height=\"685\">\u003c/div>\u003cfigcaption>\u003cstrong>Galerius\u003c/strong>Caesar\u003cspan class=\"depiction\">Ancient object; attribution per source\u003c/span>\u003c/figcaption>\u003cdetails class=\"picture-zoom\">\u003csummary>Enlarge\u003c/summary>\u003cimg src=\"../images/people/galerius.jpg\" alt=\"Galerius: Ancient object; attribution per source\" width=\"500\" height=\"685\">\u003c/details>\u003c/figure>\u003cfigure>\u003cdiv class=\"image-frame\">\u003cimg src=\"../images/people/constantius-chlorus.jpg\" alt=\"Constantius Chlorus: Ancient object; attribution per source\" width=\"1920\" height=\"2877\">\u003c/div>\u003cfigcaption>\u003cstrong>Constantius Chlorus\u003c/strong>Caesar\u003cspan class=\"depiction\">Ancient object; attribution per source\u003c/span>\u003c/figcaption>\u003cdetails class=\"picture-zoom\">\u003csummary>Enlarge\u003c/summary>\u003cimg src=\"../images/people/constantius-chlorus.jpg\" alt=\"Constantius Chlorus: Ancient object; attribution per source\" width=\"1920\" height=\"2877\">\u003c/details>\u003c/figure>\u003c/section>\n  \u003csection class=\"quotation\" aria-label=\"Gibbon quotation\">\n    \u003ch2>Gibbon\u003c/h2>\n    \u003cblockquote>“It required such a fortunate mixture of different tempers and abilities as could scarcely be found or even expected a second time; two emperors without jealousy, two Caesars without ambition, and the same general interest invariably pursued by four independent princes.”\u003c/blockquote>\n  \u003c/section>\n  \u003cdetails class=\"more\">\u003csummary>More context\u003c/summary>\u003cdiv class=\"detail-content\">In \u003cstrong>306\u003c/strong>, the soldiers acclaimed \u003cstrong>Constantine\u003c/strong>, son of Constantius I, while \u003cstrong>Maxentius\u003c/strong>, son of Maximian, seized power at Rome. Dynastic claims and military backing disrupted the planned succession.\u003c/div>\u003c/details>\n  \u003cdetails class=\"sources\">\u003csummary>Sources\u003c/summary>\u003cdiv class=\"detail-content\">\u003ca href=\"../sources/mueller-volumes-1-2.md#L1471\">Gibbon, L1471\u003c/a>; \u003ca href=\"../sources/mueller-volumes-1-2.md#L1483\">Gibbon, Ch. XIV, L1483\u003c/a>; \u003ca href=\"../sources/mueller-volumes-1-2.md#L1487\">Gibbon, Ch. XIV, L1487\u003c/a>.\u003c/div>\u003c/details>\n  \u003cdetails class=\"sources\">\u003csummary>Image credits\u003c/summary>\u003cdiv class=\"detail-content\">\u003cp>\u003cstrong>Diocletian\u003c/strong>\u003cbr>Dosseman · \u003ca href=\"https://commons.wikimedia.org/wiki/File:Istanbul_Archaeology_Museum_Bust_of_Diocletian,_from_Nikomedia,_Izmit,_end_3rd_century_AD_1536.jpg\">Source\u003c/a> · \u003ca href=\"https://creativecommons.org/licenses/by-sa/4.0\">CC BY-SA 4.0\u003c/a>\u003cbr>Own work · Attribute the creator, link the exact licence, mark changes, and apply its ShareAlike terms to adaptations.\u003cbr>Displayed without cropping or alteration.\u003c/p>\u003cp>\u003cstrong>Maximian\u003c/strong>\u003cbr>Pierre-Selim · \u003ca href=\"https://commons.wikimedia.org/wiki/File:Mus%C3%A9e_Saint-Raymond_-_2017-09-02_-_Inv._Ra_34b_-_4654.jpg\">Source\u003c/a> · Public domain\u003cbr>Self-photographed · Source records public domain / dedication; keep provenance and check territorial or non-copyright restrictions before publication.\u003cbr>Displayed without cropping or alteration.\u003c/p>\u003cp>\u003cstrong>Galerius\u003c/strong>\u003cbr>Shinjirod · \u003ca href=\"https://commons.wikimedia.org/wiki/File:Romuliana_Galerius_head.jpg\">Source\u003c/a> · \u003ca href=\"https://creativecommons.org/licenses/by/3.0\">CC BY 3.0\u003c/a>\u003cbr>Own work · Attribute the creator, link the exact licence, and mark changes.\u003cbr>Displayed without cropping or alteration.\u003c/p>\u003cp>\u003cstrong>Constantius Chlorus\u003c/strong>\u003cbr>Marie-Lan Nguyen · \u003ca href=\"https://commons.wikimedia.org/wiki/File:Constantius_Chlorus_Ny_Carlsberg_Glyptotek_IN836.jpg\">Source\u003c/a> · Public domain\u003cbr>Own work · Source records public domain / dedication; keep provenance and check territorial or non-copyright restrictions before publication.\u003cbr>Displayed without cropping or alteration.\u003c/p>\u003c/div>\u003c/details>\n\u003c/main>\n"},{"id":"gibbon-00-julian-theodosius","label":"Six pictures + sequence","front":"\u003cmain class=\"gibbon-card\">\n  \u003cp class=\"deck-label\">Gibbon · Decline and Fall\u003c/p>\n  \u003cdiv class=\"question\">What sequence connects Julian’s death in Persia to Theodosius’s eastern settlement?\u003c/div>\n  \n\u003c/main>\n","back":"\u003cmain class=\"gibbon-card\">\n  \u003cp class=\"deck-label\">Gibbon · Decline and Fall\u003c/p>\n  \u003cdiv class=\"question question-reminder\">What sequence connects Julian’s death in Persia to Theodosius’s eastern settlement?\u003c/div>\n  \u003chr id=\"answer\">\n  \u003csection class=\"answer-text\" aria-label=\"Answer\">\u003cstrong>Julian dies in 363 → Jovian → Valentinian I and Valens in 364.\u003c/strong> After \u003cstrong>Valens falls at Adrianople in 378\u003c/strong>, the western emperor \u003cstrong>Gratian appoints Theodosius I in 379\u003c/strong>; the Gothic war ends in settlement by \u003cstrong>382\u003c/strong>.\u003c/section>\n  \u003csection class=\"pictures\" aria-label=\"Pictures\">\u003cfigure>\u003cdiv class=\"image-frame\">\u003cimg src=\"../images/people/julian-emperor.jpg\" alt=\"Julian (emperor): Ancient object; uncertain identity\" width=\"425\" height=\"673\">\u003c/div>\u003cfigcaption>\u003cstrong>Julian (emperor)\u003c/strong>Emperor\u003cspan class=\"depiction\">Ancient object; uncertain identity · Chalcedony portrait attributed to Julian; the identification is scholarly interpretation, not secure.\u003c/span>\u003c/figcaption>\u003cdetails class=\"picture-zoom\">\u003csummary>Enlarge\u003c/summary>\u003cimg src=\"../images/people/julian-emperor.jpg\" alt=\"Julian (emperor): Ancient object; uncertain identity\" width=\"425\" height=\"673\">\u003c/details>\u003c/figure>\u003cfigure>\u003cdiv class=\"image-frame\">\u003cimg src=\"../images/people/jovian-emperor.jpg\" alt=\"Jovian (emperor): Ancient object; attribution per source\" width=\"1280\" height=\"1219\">\u003c/div>\u003cfigcaption>\u003cstrong>Jovian (emperor)\u003c/strong>Emperor\u003cspan class=\"depiction\">Ancient object; attribution per source\u003c/span>\u003c/figcaption>\u003cdetails class=\"picture-zoom\">\u003csummary>Enlarge\u003c/summary>\u003cimg src=\"../images/people/jovian-emperor.jpg\" alt=\"Jovian (emperor): Ancient object; attribution per source\" width=\"1280\" height=\"1219\">\u003c/details>\u003c/figure>\u003cfigure>\u003cdiv class=\"image-frame\">\u003cimg src=\"../images/people/valentinian-i.png\" alt=\"Valentinian I: Ancient object; attribution per source\" width=\"500\" height=\"486\">\u003c/div>\u003cfigcaption>\u003cstrong>Valentinian I\u003c/strong>Western emperor\u003cspan class=\"depiction\">Ancient object; attribution per source · Explicitly identified coin obverse of Valentinian I; rejected default file named for Valens.\u003c/span>\u003c/figcaption>\u003cdetails class=\"picture-zoom\">\u003csummary>Enlarge\u003c/summary>\u003cimg src=\"../images/people/valentinian-i.png\" alt=\"Valentinian I: Ancient object; attribution per source\" width=\"500\" height=\"486\">\u003c/details>\u003c/figure>\u003cfigure>\u003cdiv class=\"image-frame\">\u003cimg src=\"../images/people/valens.png\" alt=\"Valens: Ancient object; attribution per source\" width=\"500\" height=\"492\">\u003c/div>\u003cfigcaption>\u003cstrong>Valens\u003c/strong>Eastern emperor\u003cspan class=\"depiction\">Ancient object; attribution per source\u003c/span>\u003c/figcaption>\u003cdetails class=\"picture-zoom\">\u003csummary>Enlarge\u003c/summary>\u003cimg src=\"../images/people/valens.png\" alt=\"Valens: Ancient object; attribution per source\" width=\"500\" height=\"492\">\u003c/details>\u003c/figure>\u003cfigure>\u003cdiv class=\"image-frame\">\u003cimg src=\"../images/people/gratian.jpg\" alt=\"Gratian: Ancient object; attribution per source\" width=\"1920\" height=\"2560\">\u003c/div>\u003cfigcaption>\u003cstrong>Gratian\u003c/strong>Western emperor\u003cspan class=\"depiction\">Ancient object; attribution per source\u003c/span>\u003c/figcaption>\u003cdetails class=\"picture-zoom\">\u003csummary>Enlarge\u003c/summary>\u003cimg src=\"../images/people/gratian.jpg\" alt=\"Gratian: Ancient object; attribution per source\" width=\"1920\" height=\"2560\">\u003c/details>\u003c/figure>\u003cfigure>\u003cdiv class=\"image-frame\">\u003cimg src=\"../images/people/theodosius-i.jpg\" alt=\"Theodosius I: Ancient object; attribution per source\" width=\"330\" height=\"514\">\u003c/div>\u003cfigcaption>\u003cstrong>Theodosius I\u003c/strong>Eastern emperor\u003cspan class=\"depiction\">Ancient object; attribution per source\u003c/span>\u003c/figcaption>\u003cdetails class=\"picture-zoom\">\u003csummary>Enlarge\u003c/summary>\u003cimg src=\"../images/people/theodosius-i.jpg\" alt=\"Theodosius I: Ancient object; attribution per source\" width=\"330\" height=\"514\">\u003c/details>\u003c/figure>\u003c/section>\n  \n  \n  \u003cdetails class=\"sources\">\u003csummary>Sources\u003c/summary>\u003cdiv class=\"detail-content\">\u003ca href=\"../sources/mueller-volumes-1-2.md#L2254\">Gibbon, Ch. XXIV, L2254\u003c/a>; \u003ca href=\"../sources/mueller-volumes-1-2.md#L2256\">Gibbon, Ch. XXIV, L2256\u003c/a>; \u003ca href=\"../sources/mueller-volumes-1-2.md#L2297\">Gibbon, Ch. XXV, L2297\u003c/a>; \u003ca href=\"../sources/mueller-volumes-1-2.md#L2301\">Gibbon, Ch. XXV, L2301\u003c/a>; \u003ca href=\"../sources/mueller-volumes-1-2.md#L2404\">Gibbon, Ch. XXVI, L2404\u003c/a>; \u003ca href=\"../sources/mueller-volumes-1-2.md#L2414\">Gibbon, Ch. XXVI, L2414\u003c/a>; \u003ca href=\"../sources/mueller-volumes-1-2.md#L2418\">Gibbon, Ch. XXVI, L2418\u003c/a>.\u003c/div>\u003c/details>\n  \u003cdetails class=\"sources\">\u003csummary>Image credits\u003c/summary>\u003cdiv class=\"detail-content\">\u003cp>\u003cstrong>Julian (emperor)\u003c/strong>\u003cbr>Sergey Sosnovskiy · \u003ca href=\"https://commons.wikimedia.org/wiki/File:Chalcedony_bust_of_Julian_(1).png\">Source\u003c/a> · \u003ca href=\"https://creativecommons.org/licenses/by-sa/4.0\">CC BY-SA 4.0\u003c/a>\u003cbr>https://ancientrome.ru/art/artworken/img.htm?id=8167 · Attribute the creator, link the exact licence, mark changes, and apply its ShareAlike terms to adaptations.\u003cbr>Displayed without cropping or alteration.\u003c/p>\u003cp>\u003cstrong>Jovian (emperor)\u003c/strong>\u003cbr>Jovian. AD 363-364. AV Solidus (21mm, 4.46 g, 12h). Antioch mint, 7th officina. D N IOVIAN VS P F AVG, pearl-diademed, draped, and cuirassed bust right / SECVRITA S REI PVBLICAE, Roma, holding spear in left hand, and Constantinopolis, with right foot on prow and holding scepter in left hand, enthroned facing, the latter turned to left, holding between them a shield inscribed VOT/ V/ MVL/ X in four lines; ANTZ. RIC VIII 222; Depeyrot 18/1; Biaggi 2225 var. (officina); Mazzini 8 var. (same). Lustrous. Choice EF. Rare and exceptional for issue.\n\nFrom the Willamette Valley Collection. Ex Provence Collection (Classical Numismatic Group 114, 13 May 2020), lot 1017; Rauch 102 (7 November 2016), lot 564; Künker 273 (14 March 2016), lot 957; Hess-Divo 326 (28 May 2014), lot 120; Numistatica Ars Classica 75 (18 November 2013), lot 345; Classical Numismatic Review XXI.2 (Fall 1996), no. 65; Vinchon (24 April 1996), loy 117; Hermann Vogel Collection (A. Hess 194, 25 March 1929), lot 964. · \u003ca href=\"https://commons.wikimedia.org/wiki/File:Solidus_of_Jovian2_(obverse).jpg\">Source\u003c/a> · \u003ca href=\"https://creativecommons.org/licenses/by-sa/2.5\">CC BY-SA 2.5\u003c/a>\u003cbr>Coin Archives · Attribute the creator, link the exact licence, mark changes, and apply its ShareAlike terms to adaptations.\u003cbr>Displayed without cropping or alteration.\u003c/p>\u003cp>\u003cstrong>Valentinian I\u003c/strong>\u003cbr>АНО &quot;Международный нумизматический клуб&quot; · \u003ca href=\"https://commons.wikimedia.org/wiki/File:INC-3035-a_%D0%A1%D0%BE%D0%BB%D0%B8%D0%B4._%D0%92%D0%B0%D0%BB%D0%B5%D0%BD%D1%82%D0%B8%D0%BD%D0%B8%D0%B0%D0%BD_I._%D0%9E%D0%BA._367%E2%80%94375_%D0%B3%D0%B3._(%D0%B0%D0%B2%D0%B5%D1%80%D1%81).png\">Source\u003c/a> · \u003ca href=\"https://creativecommons.org/licenses/by-sa/4.0\">CC BY-SA 4.0\u003c/a>\u003cbr>АНО &quot;Международный нумизматический клуб&quot; · Attribute the creator, link the exact licence, mark changes, and apply its ShareAlike terms to adaptations.\u003cbr>Displayed without cropping or alteration.\u003c/p>\u003cp>\u003cstrong>Valens\u003c/strong>\u003cbr>АНО &quot;Международный нумизматический клуб&quot; · \u003ca href=\"https://commons.wikimedia.org/wiki/File:INC-3015-a_%D0%A1%D0%BE%D0%BB%D0%B8%D0%B4._%D0%92%D0%B0%D0%BB%D0%B5%D0%BD%D1%82_II._%D0%9E%D0%BA._364_%D0%B3._(%D0%B0%D0%B2%D0%B5%D1%80%D1%81).png\">Source\u003c/a> · \u003ca href=\"https://creativecommons.org/licenses/by-sa/4.0\">CC BY-SA 4.0\u003c/a>\u003cbr>АНО &quot;Международный нумизматический клуб&quot; · Attribute the creator, link the exact licence, mark changes, and apply its ShareAlike terms to adaptations.\u003cbr>Displayed without cropping or alteration.\u003c/p>\u003cp>\u003cstrong>Gratian\u003c/strong>\u003cbr>SJuergen · \u003ca href=\"https://commons.wikimedia.org/wiki/File:Gratian_Trier_enhanced.jpg\">Source\u003c/a> · \u003ca href=\"https://creativecommons.org/licenses/by-sa/3.0\">CC BY-SA 3.0\u003c/a>\u003cbr>Own work · Attribute the creator, link the exact licence, mark changes, and apply its ShareAlike terms to adaptations.\u003cbr>Displayed without cropping or alteration.\u003c/p>\u003cp>\u003cstrong>Theodosius I\u003c/strong>\u003cbr>www.livius.org · \u003ca href=\"https://commons.wikimedia.org/wiki/File:Bust_of_Theodosius_I.jpg\">Source\u003c/a> · \u003ca href=\"https://creativecommons.org/licenses/by-sa/4.0\">CC BY-SA 4.0\u003c/a>\u003cbr>https://www.livius.org/pictures/turkey/aphrodisias/aphrodisias-museum-pieces/theodosius-i-or-ii/ · Attribute the creator, link the exact licence, mark changes, and apply its ShareAlike terms to adaptations.\u003cbr>Displayed without cropping or alteration.\u003c/p>\u003c/div>\u003c/details>\n\u003c/main>\n"},{"id":"gibbon-00-church-power","label":"Text only","front":"\u003cmain class=\"gibbon-card\">\n  \u003cp class=\"deck-label\">Gibbon · Decline and Fall\u003c/p>\n  \u003cdiv class=\"question\">How did imperial favour change the church’s political position between Decius and Constantine’s successors?\u003c/div>\n  \n\u003c/main>\n","back":"\u003cmain class=\"gibbon-card\">\n  \u003cp class=\"deck-label\">Gibbon · Decline and Fall\u003c/p>\n  \u003cdiv class=\"question question-reminder\">How did imperial favour change the church’s political position between Decius and Constantine’s successors?\u003c/div>\n  \u003chr id=\"answer\">\n  \u003csection class=\"answer-text\" aria-label=\"Answer\">A community pressed to sacrifice under \u003cstrong>Decius in 250\u003c/strong> became a recipient of imperial support under \u003cstrong>Constantine\u003c/strong>. Bishops could then seek state enforcement against Christian rivals; the emperor’s favour both strengthened the church and made doctrine vulnerable to court politics.\u003c/section>\n  \n  \n  \n  \u003cdetails class=\"sources\">\u003csummary>Sources\u003c/summary>\u003cdiv class=\"detail-content\">\u003ca href=\"../sources/mueller-volumes-1-2.md#L1735\">Gibbon, Ch. XVI, L1735\u003c/a>; \u003ca href=\"../sources/mueller-volumes-1-2.md#L2024\">Gibbon, Ch. XX, L2024\u003c/a>; \u003ca href=\"../sources/mueller-volumes-1-2.md#L2059\">Gibbon, Ch. XXI, L2059\u003c/a>; \u003ca href=\"../sources/mueller-volumes-1-2.md#L2097\">Gibbon, Ch. XXI, L2097\u003c/a>.\u003c/div>\u003c/details>\n  \n\u003c/main>\n"},{"id":"gibbon-01-trajan-column","label":"Quotation without pictures","front":"\u003cmain class=\"gibbon-card\">\n  \u003cp class=\"deck-label\">Gibbon · Decline and Fall\u003c/p>\n  \u003cdiv class=\"question\">What did Trajan&#39;s Column commemorate, and why does Gibbon dwell on it?\u003c/div>\n  \n\u003c/main>\n","back":"\u003cmain class=\"gibbon-card\">\n  \u003cp class=\"deck-label\">Gibbon · Decline and Fall\u003c/p>\n  \u003cdiv class=\"question question-reminder\">What did Trajan&#39;s Column commemorate, and why does Gibbon dwell on it?\u003c/div>\n  \u003chr id=\"answer\">\n  \u003csection class=\"answer-text\" aria-label=\"Answer\">His \u003cstrong>Dacian victories\u003c/strong>. The veteran could revisit his campaigns in marble; the peaceful citizen could borrow a share of their glory.\u003c/section>\n  \n  \u003csection class=\"quotation\" aria-label=\"Gibbon quotation\">\n    \u003ch2>Gibbon\u003c/h2>\n    \u003cblockquote>“The veteran soldier contemplated the story of his own campaigns, and by an easy illusion of national vanity, the peaceful citizen associated himself to the honors of the triumph.”\u003c/blockquote>\n  \u003c/section>\n  \u003cdetails class=\"more\">\u003csummary>More context\u003c/summary>\u003cdiv class=\"detail-content\">The column stood in Trajan&#39;s public forum; Gibbon gives its height as \u003cstrong>110 feet\u003c/strong>.\u003c/div>\u003c/details>\n  \u003cdetails class=\"sources\">\u003csummary>Sources\u003c/summary>\u003cdiv class=\"detail-content\">\u003ca href=\"../sources/mueller-opening.md#L637\">Gibbon, Ch. II, L637\u003c/a>.\u003c/div>\u003c/details>\n  \n\u003c/main>\n"}];
